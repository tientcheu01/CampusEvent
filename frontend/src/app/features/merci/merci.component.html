<canvas #confettiCanvas id="confetti-canvas" aria-hidden="true"></canvas>

<app-header [links]="headerLinks"></app-header>

<main>
  <div class="success-card">
    <div class="checkmark-wrapper">
      <svg viewBox="0 0 52 52">
        <circle class="checkmark-circle" cx="26" cy="26" r="25" />
        <path class="checkmark-check" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
      </svg>
    </div>

    <h1>Merci pour votre inscription !</h1>

    <p>Votre dossier de candidature pour le <span class="highlight-text">Prix SJI INNOVA 2026</span> a été transmis avec succès.</p>

    <p class="confirmation-text">Un email de confirmation vous sera envoyé prochainement. Notre jury examinera votre projet lors de la phase de présélection.</p>

    <div class="divider"></div>

    <a routerLink="/" class="btn-home">
      <i class="fas fa-arrow-left"></i> Retour à l'accueil
    </a>
  </div>
</main>

<app-footer></app-footer>
